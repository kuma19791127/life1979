<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ライフ モバイルレジ - バーコード専用</title>

    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 10px;
            text-align: center;
            background: #f4f4f4;
            color: #333;
        }
        /* ページ切り替え */
        .page { display: none; }
        .page.active { display: block; }

        /* ヘッダー */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 0;
            gap: 10px;
        }
        .logo { height: 40px; width: auto; }

        /* スキャン画面 */
        #scanner-container {
            width: 100%;
            max-width: 400px;
            margin: auto;
            position: relative;
            border: 4px solid #008D40;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4/3;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .scan-guide {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80%; height: 30%;
            border: 3px solid #FFD700;
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5);
            z-index: 5;
            border-radius: 10px;
        }
        #mask {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 141, 64, 0.7);
            color: white;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            z-index: 10;
        }

        /* ボタン */
        .btn {
            border: none; padding: 15px; border-radius: 8px;
            font-size: 18px; font-weight: bold; width: 100%;
            cursor: pointer; margin-bottom: 10px;
        }
        .next-btn { background: #FFD700; color: #333; display: none; border: 2px solid #b8860b; }
        .pay-btn { background: #008D40; color: white; }

        /* カートリスト */
        .cart-list {
            margin-top: 15px; background: white; padding: 15px;
            border-radius: 8px; text-align: left;
        }
        .total-price {
            font-size: 28px; font-weight: bold; color: #d32f2f;
            margin: 10px 0; text-align: right;
        }
