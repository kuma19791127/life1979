




<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ライフ モバイルレジ - バーコード専用</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
            text-align: center;
            background: #f4f4f4;
            color: #333;
        }
        /* ページ切り替え */
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        /* ヘッダー：ロゴ表示エリア */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 0;
            gap: 10px;
        }
        .logo {
            height: 40px;
            width: auto;
        }
        /* スキャン画面 */
        #scanner-container {
            width: 100%;
            max-width: 400px;
            margin: auto;
            position: relative;
            border: 4px solid #008D40;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4/3;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* 黄色のスキャン枠 */
        .scan-guide {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 30%;
            /* バーコードに合わせて少し横長に調整 */
            border: 3px solid #FFD700;
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5);
            z-index: 5;
            border-radius: 10px;
        }
        #mask {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 141, 64, 0.7);
            color: white;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            z-index: 10;
        }
        /* ボタン */
        .btn {
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .next-btn {
            background: #FFD700;
            color: #333;
            display: none;
            border: 2px solid #b8860b;
        }
        .pay-btn {
            background: #008D40;
            color: white;
        }
        .cart-list {
            margin-top: 15px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
        }
        .total-price {
            font-size: 28px;
            font-weight: bold;
            color: #d32f2f;
            margin: 10px 0;
            text-align: right;
        }
        .item-row {
            border-bottom: 1px solid #eee;
            padding: 8px 0;
            display: flex;
            justify-content: space-between;
        }
        /* QRコード表示エリア */
        #qr-display-area {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .qr-instruction {
            margin-top: 15px;
            font-weight: bold;
            color: #008D40;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="page-scan" class="page active">
        <div class="header">
            <img src="2026-01-22 200607.png" alt="ライフ" class="logo"
                onerror="this.src='https://placehold.jp/24/008d40/ffffff/100x40.png?text=LIFE'">
            <h2 style="color: #008D40; margin: 0;">モバイル レジ</h2>
        </div>
        <div id="scanner-container">
            <video id="video"></video>
            <div class="scan-guide"></div>
            <div id="mask">スキャン完了</div>
        </div>
        <div style="margin-top: 15px;">
            <button id="btn-next" class="btn next-btn" onclick="resumeScan()">✅ 確定：次をスキャン</button>
            <button id="btn-go-pay" class="btn pay-btn" onclick="goToPayment()">合計金額で決済へ (QR表示)</button>
        </div>
        <div class="cart-list">
            <div class="total-price">合計: ¥<span id="total-display">0</span></div>
            <div id="items"></div>
        </div>
    </div>
    <!-- 決済ページ（QRコード提示画面） -->
    <div id="page-payment" class="page">
        <div class="header">
            <img src="2026-01-22 200607.png" alt="ライフ" class="logo"
                onerror="this.src='https://placehold.jp/24/008d40/ffffff/100x40.png?text=LIFE'">
            <h2 style="color: #008D40; margin: 0;">お客様ご案内</h2>
        </div>
        <div class="cart-list" style="text-align: center; padding: 30px 15px;">
            <p style="margin: 0; color: #666;">お支払い合計</p>
            <div class="total-price" style="text-align: center; font-size: 42px; margin: 10px 0;">
                ¥<span id="final-total">0</span>
            </div>
            <!-- QRコード表示エリア -->
            <div id="qr-display-area">
                <div id="qrcode"></div>
                <p class="qr-instruction">お客様のスマートフォンで<br>読み取ってください</p>
            </div>
            <button class="btn pay-btn" onclick="location.reload()"
                style="margin-top: 30px; background-color: #333;">次のお客様へ (最初に戻る)</button>
            <button class="btn" style="background:#ccc; margin-top: 10px;" onclick="backToScan()">戻る</button>
        </div>
    </div>
    <script src="products.js"></script>
    <script>
        // --- バーコード限定の設定 ---
        const hints = new Map();
        const formats = [
            ZXing.BarcodeFormat.EAN_13, // 13桁の標準バーコード
            ZXing.BarcodeFormat.EAN_8, // 8桁の短縮バーコード
            ZXing.BarcodeFormat.CODE_128 // その他のバーコード形式
        ];
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
        // ヒントを指定してリーダーを初期化
        const codeReader = new ZXing.BrowserMultiFormatReader(hints);
        let total = 0;
        let isPaused = false;
        let cartItems = []; // カートの商品管理用
        // --- Mock APIs ---
        // 1. Product Info API Mock
        async function mockProductApi(janCode) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    // products.js で定義された productMaster を参照
                    if (typeof productMaster !== 'undefined' && productMaster[janCode]) {
                        resolve({ janCode, ...productMaster[janCode] });
                    } else {
                        // 未登録商品はデフォルト値で返す
                        resolve({
                            janCode,
                            name: "未登録商品",
                            price: 200,
                            category: "不明"
                        });
                    }
                }, 500); // 500ms delay
            });
        }
        // 決済ボタンを押した時の処理（QRコード生成）
        async function goToPayment() {
            if (total === 0) return alert("商品がありません");
            // UI遷移: ローディング表示
            const mask = document.getElementById('mask');
            mask.innerText = "決済QRコード作成中...";
            mask.style.display = 'flex';
            try {
                // GMO Link Type Plus のURLを取得
                const initRes = await mockPaymentInitApi(cartItems, total);
                const paymentUrl = initRes.paymentUrl;
                // UI切り替え: 支払い画面へ
                document.getElementById('page-scan').classList.remove('active');
                document.getElementById('page-payment').classList.add('active');
                document.getElementById('final-total').innerText = total.toLocaleString();
                // QRコード生成
                const qrContainer = document.getElementById('qrcode');
                qrContainer.innerHTML = ""; // クリア
                new QRCode(qrContainer, {
                    text: paymentUrl,
                    width: 256,
                    height: 256,
                    correctLevel: QRCode.CorrectLevel.M
                });
                mask.style.display = 'none';
            } catch (e) {
                console.error(e);
                alert("決済開始に失敗しました: " + e.message);
                // エラー時はスキャン画面に戻す
                mask.style.display = 'none';
            }
        }
        function backToScan() {
            document.getElementById('page-payment').classList.remove('active');
            document.getElementById('page-scan').classList.add('active');
        }
        // 2. Payment Init API (AWS Backend Call)
        async function mockPaymentInitApi(cartData, totalAmount) {
            const AWS_URL = 'https://c7fnqeywme.execute-api.us-east-1.amazonaws.com/default/gmo-payment-url-generator';
            try {
                const response = await fetch(AWS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        amount: totalAmount,
                        // GMO format fix: Pure alphanumeric, no symbols
                        orderId: "T" + Date.now()
                    })
                });
                if (!response.ok) {
                    throw new Error("AWS API Connection Failed: " + response.status);
                }
                return await response.json();
            } catch (e) {
                console.warn("AWS Connection failed, falling back to mock.", e);
                alert("AWS接続エラー: " + e.message);
                throw e; // エラーを上に投げて呼び出し元で処理させる
            }
        }
        // ----------------
        async function startScanner() {
            try {
                const videoInputDevices = await codeReader.listVideoInputDevices();
                // 背面カメラ（Rear/Back）を優先的に探す
                const backCamera = videoInputDevices.find(device =>
                    device.label.toLowerCase().includes('back') ||
                    device.label.toLowerCase().includes('rear')
                );
                const deviceId = backCamera ? backCamera.deviceId : videoInputDevices[0].deviceId;
                codeReader.decodeFromVideoDevice(deviceId, 'video', (result, err) => {
                    if (result && !isPaused) {
                        onScanSuccess(result.text);
                    }
                    // NotFoundException はスキャン中常に発生するので無視する
                    if (err && !(err instanceof ZXing.NotFoundException)) {
                        console.error(err);
                    }
                });
            } catch (err) {
                console.error("カメラの起動に失敗しました:", err);
                alert("カメラにアクセスできません。設定を確認してください。");
            }
        }
        async function onScanSuccess(code) {
            if (isPaused) return; // 二重読み取り防止
            isPaused = true;
            const mask = document.getElementById('mask');
            mask.innerText = "商品情報 問い合わせ中...";
            mask.style.display = 'flex';
            try {
                // API呼び出し
                const product = await mockProductApi(code);
                mask.innerText = "スキャン完了";
                document.getElementById('btn-next').style.display = 'block';
                document.getElementById('btn-go-pay').style.display = 'block'; // 常に決済ボタンは見せておく
                total += product.price;
                cartItems.push(product); // カート保存
                const row = document.createElement('div');
                row.className = 'item-row';
                const nameDisplay = product.name.length > 10 ? product.name.substr(0, 10) + "..." : product.name;
                row.innerHTML = `
                    <div style="display:flex; flex-direction:column; align-items:flex-start;">
                        <span style="font-size:14px; color:#555;">${code}</span>
                        <span>${nameDisplay}</span>
                    </div>
                    <span style="font-weight:bold;">¥${product.price.toLocaleString()}</span>
                `;
                document.getElementById('items').prepend(row);
                document.getElementById('total-display').innerText = total.toLocaleString();
                if (navigator.vibrate) navigator.vibrate(100);
            } catch (error) {
                alert("商品情報の取得に失敗しました");
                resumeScan(); // エラー時は復帰
            }
        }
        function resumeScan() {
            isPaused = false;
            document.getElementById('mask').style.display = 'none';
            document.getElementById('btn-next').style.display = 'none';
            // document.getElementById('btn-go-pay').style.display = 'block';
        }
        // デバッグ用：手動入力
        function manualInput() {
            const code = prompt("JANコードを入力してください（デバッグ用）", "4977634803472");
            if (code) {
                onScanSuccess(code);
            }
        }
        // --- 初期化フロー ---
        // ブラウザの自動再生ポリシー(バイブレーション/音声)対策として
        // ユーザーの明示的な操作(タップ)があってからカメラを開始する
        function initApp() {
            const mask = document.getElementById('mask');
            mask.style.display = 'flex';
            mask.style.background = 'rgba(0,0,0,0.8)';
            mask.innerHTML = '<div style="cursor:pointer; padding:20px; border:2px solid #FFD700; border-radius:8px;">📷 タップして利用を開始する</div>';
            // マスク全体をクリックで開始
            mask.onclick = () => {
                // 初回インタラクションでポリシー解除
                if (navigator.vibrate) try { navigator.vibrate(0); } catch (e) { }
                mask.style.display = 'none';
                mask.onclick = null; // ハンドラ解除
                mask.innerText = "スキャン完了"; // 文言戻しておく
                startScanner();
            };
        }
        // アプリ起動
        initApp();
    </script>
    <!-- デバッグ用ボタン -->
    <div style="position:fixed; bottom:10px; right:10px; opacity:0.7;">
        <button onclick="manualInput()" style="padding:10px; font-size:12px;">🛠 手動入力</button>
    </div>
</body>
</html>
