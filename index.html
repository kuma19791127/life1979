<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ライフ モバイルレジ - バーコード専用</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 10px; text-align: center; background: #f4f4f4; color: #333; }
        
        /* ページ切り替え */
        .page { display: none; }
        .page.active { display: block; }

        /* ヘッダー：ロゴ表示エリア */
        .header { display: flex; align-items: center; justify-content: center; padding: 10px 0; gap: 10px; }
        .logo { height: 40px; width: auto; }

        /* スキャン画面 */
        #scanner-container { width: 100%; max-width: 400px; margin: auto; position: relative; border: 4px solid #008D40; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 4/3; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* 黄色のスキャン枠 */
        .scan-guide {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80%; height: 30%; /* バーコードに合わせて少し横長に調整 */
            border: 3px solid #FFD700;
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.5);
            z-index: 5;
            border-radius: 10px;
        }

        #mask { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 141, 64, 0.7); color: white; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; z-index: 10; }

        /* ボタン */
        .btn { border: none; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: bold; width: 100%; cursor: pointer; margin-bottom: 10px; }
        .next-btn { background: #FFD700; color: #333; display: none; border: 2px solid #b8860b; }
        .pay-btn { background: #008D40; color: white; }

        .cart-list { margin-top: 15px; background: white; padding: 15px; border-radius: 8px; text-align: left; }
        .total-price { font-size: 28px; font-weight: bold; color: #d32f2f; margin: 10px 0; text-align: right; }
        .item-row { border-bottom: 1px solid #eee; padding: 8px 0; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <div id="page-scan" class="page active">
        <div class="header">
            <img src="2026-01-22 200607.png" alt="ライフ" class="logo" onerror="this.src='https://placehold.jp/24/008d40/ffffff/100x40.png?text=LIFE'">
            <h2 style="color: #008D40; margin: 0;">モバイル レジ</h2>
        </div>

        <div id="scanner-container">
            <video id="video"></video>
            <div class="scan-guide"></div>
            <div id="mask">スキャン完了</div>
        </div>

        <div style="margin-top: 15px;">
            <button id="btn-next" class="btn next-btn" onclick="resumeScan()">✅ 確定：次をスキャン</button>
            <button id="btn-go-pay" class="btn pay-btn" onclick="goToPayment()">合計金額で決済へ</button>
        </div>

        <div class="cart-list">
            <div class="total-price">合計: ¥<span id="total-display">0</span></div>
            <div id="items"></div>
        </div>
    </div>

    <div id="page-payment" class="page">
        <div class="header">
            <img src="2026-01-22 200607.png" alt="ライフ" class="logo" onerror="this.src='https://placehold.jp/24/008d40/ffffff/100x40.png?text=LIFE'">
            <h2 style="color: #008D40; margin: 0;">決済</h2>
        </div>
        <div class="cart-list" style="text-align: center; padding: 30px 15px;">
            <p style="margin: 0; color: #666;">お支払い合計</p>
            <div class="total-price" style="text-align: center; font-size: 42px; margin: 10px 0;">
                ¥<span id="final-total">0</span>
            </div>
            <div id="qr-code" style="display: flex; justify-content: center; margin: 20px 0;"></div>
            <button class="btn pay-btn" onclick="location.reload()">✅ 決済完了を確認</button>
            <button class="btn" style="background:#ccc;" onclick="backToScan()">戻る</button>
        </div>
    </div>

    <script>
        // --- バーコード限定の設定 ---
        const hints = new Map();
        const formats = [
            ZXing.BarcodeFormat.EAN_13, // 13桁の標準バーコード
            ZXing.BarcodeFormat.EAN_8,  // 8桁の短縮バーコード
            ZXing.BarcodeFormat.CODE_128 // その他のバーコード形式
        ];
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);

        // ヒントを指定してリーダーを初期化
        const codeReader = new ZXing.BrowserMultiFormatReader(hints);
        
        let total = 0;
        let isPaused = false;
        const priceMap = { "4977634803472": 322 };

        async function startScanner() {
            try {
                const videoInputDevices = await codeReader.listVideoInputDevices();
                
                // 背面カメラ（Rear/Back）を優先的に探す
                const backCamera = videoInputDevices.find(device => 
                    device.label.toLowerCase().includes('back') || 
                    device.label.toLowerCase().includes('rear')
                );
                const deviceId = backCamera ? backCamera.deviceId : videoInputDevices[0].deviceId;

                codeReader.decodeFromVideoDevice(deviceId, 'video', (result, err) => {
                    if (result && !isPaused) {
                        onScanSuccess(result.text);
                    }
                    // NotFoundException はスキャン中常に発生するので無視する
                    if (err && !(err instanceof ZXing.NotFoundException)) {
                        console.error(err);
                    }
                });
            } catch (err) {
                console.error("カメラの起動に失敗しました:", err);
                alert("カメラにアクセスできません。設定を確認してください。");
            }
        }

        function onScanSuccess(code) {
            isPaused = true;
            document.getElementById('mask').style.display = 'flex';
            document.getElementById('btn-next').style.display = 'block';
            document.getElementById('btn-go-pay').style.display = 'none';

            const price = priceMap[code] || 200; // マップにない場合は200円（仮）
            total += price;
            
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `<span>商品: ${code}</span><span>¥${price}</span>`;
            document.getElementById('items').prepend(row);
            document.getElementById('total-display').innerText = total.toLocaleString();

            if (navigator.vibrate) navigator.vibrate(100);
        }

        function resumeScan() {
            isPaused = false;
            document.getElementById('mask').style.display = 'none';
            document.getElementById('btn-next').style.display = 'none';
            document.getElementById('btn-go-pay').style.display = 'block';
        }

        function goToPayment() {
            if (total === 0) return alert("商品がありません");
            document.getElementById('page-scan').classList.remove('active');
            document.getElementById('page-payment').classList.add('active');
            document.getElementById('final-total').innerText = total.toLocaleString();
            document.getElementById('qr-code').innerHTML = "";
            new QRCode(document.getElementById('qr-code'), {
                text: `paypay://payment?amount=${total}`,
                width: 200, height: 200
            });
        }

        function backToScan() {
            document.getElementById('page-payment').classList.remove('active');
            document.getElementById('page-scan').classList.add('active');
        }

        // ページ読み込み時にスキャナー起動
        startScanner();
    </script>
</body>
</html>
