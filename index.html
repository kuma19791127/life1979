<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>どこでもレジ | Anywhere Register</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Google Fonts for Stylish Look -->
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet">
    <!-- 認証・設定ファイルの読み込み -->
    <script src="auth_config.js"></script>
    <style>
        :root {
            /* Modern Tech Palette */
            --primary-color: #2563EB;
            /* Vivid Blue */
            --primary-dark: #1E40AF;
            --accent-color: #F59E0B;
            /* Amber for attention */
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1F2937;
            --text-sub: #6B7280;
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Poppins', 'Noto Sans JP', sans-serif;
            margin: 0;
            padding: 0;
            background: var(--bg-gradient);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* App-like feel */
        }

        /* 共通ヘッダー */
        .app-header {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
            z-index: 100;
        }

        .header-logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-logo::before {
            content: '⚡';
            /* Icon */
        }

        .header-info {
            font-size: 11px;
            text-align: right;
            color: var(--text-sub);
            line-height: 1.3;
        }

        /* ページ切り替え */
        .page {
            display: none;
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            animation: fadeIn 0.3s ease-out;
        }

        .page.active {
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Login Screen */
        #page-login {
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 320px;
            text-align: center;
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--text-main);
        }

        .login-input {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 20px;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        .login-input:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* Store Selector Bar */
        .store-selector-bar {
            background: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #eee;
        }

        .store-icon {
            font-size: 18px;
        }

        select {
            flex: 1;
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #E5E7EB;
            background: #F9FAFB;
            font-family: inherit;
            color: var(--text-main);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-logout {
            background: #F3F4F6;
            color: var(--text-sub);
        }

        .btn-admin {
            background: #111827;
            color: #FFD700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Scanner Area */
        #scanner-container {
            width: 100%;
            max-width: 400px;
            margin: 20px auto 0;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4/3;
            position: relative;
            box-shadow: var(--shadow-lg);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scan-guide {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 40%;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            box-shadow: 0 0 0 999px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        .scan-guide::after {
            content: 'SCAN BARCODE';
            position: absolute;
            bottom: -25px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Action Buttons */
        .action-area {
            max-width: 400px;
            margin: 20px auto 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-next {
            background: var(--bg-gradient);
            color: var(--text-main);
            border: 2px solid var(--primary-color);
            display: none;
        }

        .btn-pay {
            background: var(--accuracy-color, #10B981);
            color: white;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
        }

        /* Cart List */
        .cart-container {
            background: white;
            border-radius: 16px 16px 0 0;
            margin-top: 20px;
            flex: 1;
            padding: 20px;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }

        .total-display {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-main);
            text-align: right;
            border-bottom: 2px solid #F3F4F6;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .total-display span {
            font-size: 18px;
            color: var(--text-sub);
            margin-right: 5px;
        }

        #items {
            overflow-y: auto;
            flex: 1;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            animation: slideIn 0.2s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-10px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Payment SCreen */
        #page-payment {
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .payment-card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 340px;
        }

        .qr-frame {
            border: 2px dashed var(--primary-color);
            border-radius: 16px;
            padding: 20px;
            margin: 30px 0;
            background: #F9FAFB;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Overlay Mask */
        #mask {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 50;
            backdrop-filter: blur(5px);
        }

        .mask-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <!-- 1. Login Screen -->
    <div id="page-login" class="page active">
        <div class="header-logo" style="position:absolute; top:30px; font-size:28px;">
            どこでもレジ
        </div>
        <div class="login-card">
            <div style="font-size: 48px; margin-bottom: 20px;">📱</div>
            <h2 class="login-title">Staff Login</h2>
            <p style="color:var(--text-sub); font-size:14px; margin-bottom:20px;">端末の電話番号を入力してください</p>
            <input type="tel" id="input-phone" class="login-input" placeholder="090-0000-0000" value="090-1111-2222">
            <button class="btn-primary" onclick="handleLogin()">ログインして開始</button>
            <div style="margin-top:25px; font-size:11px; color:#9CA3AF; line-height:1.6;">
                Demo Accounts:<br>
                Life: 090-1111-2222<br>
                IY: 080-3333-2222<br>
                Donki: 070-5555-2222
            </div>

            <div style="margin-top:20px; padding-top:15px; border-top:1px solid #F3F4F6;">
                <a href="landing_page.html"
                    style="color:var(--primary-color); font-size:14px; font-weight:600; text-decoration:none; display:flex; align-items:center; justify-content:center; gap:5px;">
                    <span>ℹ️</span> サービス紹介を見る (LP)
                </a>
            </div>
        </div>
    </div>

    <!-- 2. POS Screen -->
    <div id="page-pos" class="page">
        <div class="app-header">
            <div class="header-logo" id="header-chain-name"></div>
            <div class="header-info" id="header-user-info"></div>
        </div>

        <div class="store-selector-bar">
            <span class="store-icon">🏪</span>
            <select id="store-select" onchange="changeStore()"></select>
            <button class="btn-sm btn-logout" onclick="logout()">Logout</button>
            <button class="btn-sm btn-admin" onclick="showAdminStats()">📊 売上確認 (Admin)</button>
        </div>

        <div id="scanner-container">
            <video id="video"></video>
            <div class="scan-guide"></div>
            <div id="mask">
                <div class="mask-icon">📷</div>
                <div id="mask-msg">Tap to Start Camera</div>
            </div>
        </div>

        <div class="action-area">
            <button id="btn-next" class="btn-primary btn-next" onclick="resumeScan()">次を読み取る</button>
            <button id="btn-go-pay" class="btn-primary btn-pay" onclick="goToPayment()">合計金額で決済へ</button>
        </div>

        <div class="cart-container">
            <div class="total-display"><span>Total:</span>¥<span id="total-display">0</span></div>
            <div id="items"></div>
        </div>
    </div>

    <!-- 3. Payment Screen -->
    <div id="page-payment" class="page">
        <div class="payment-card">
            <h2 style="margin:0; font-size:18px; color:var(--text-sub);">お支払い金額</h2>
            <div style="font-size: 42px; font-weight:800; color:var(--text-main); margin:10px 0;">
                ¥<span id="final-total">0</span>
            </div>

            <div class="qr-frame">
                <div id="qrcode"></div>
                <p style="margin-top:15px; font-weight:600; color:var(--primary-color);">お客様用QRコード</p>
                <p style="font-size:12px; color:var(--text-sub);">ご自身のスマホで読み取ってください</p>
            </div>

            <button class="btn-primary" style="background:#1F2937;" onclick="resetPos()">取引完了 (ホームへ)</button>
            <button style="background:none; border:none; color:var(--text-sub); margin-top:15px; cursor:pointer;"
                onclick="backToScan()">キャンセル・戻る</button>
        </div>
    </div>

    <script src="products.js"></script>
    <script>
        // --- Global State ---
        let currentSession = null;
        let currentStoreConfig = null;

        // --- Auth Logic ---
        function handleLogin() {
            const phone = document.getElementById('input-phone').value;
            if (!phone) return alert("電話番号を入力してください");
            const session = authenticate(phone);
            if (session) {
                currentSession = session;
                initPosScreen(session);
            } else {
                alert("認証失敗: 登録されていない端末です。");
            }
        }

        function initPosScreen(session) {
            document.getElementById('page-login').classList.remove('active');
            document.getElementById('page-pos').classList.add('active');
            document.getElementById('header-chain-name').innerText = session.chainName;
            document.getElementById('header-user-info').innerText = `${session.deviceLabel}\nID: ${session.phoneNumber}`;

            const select = document.getElementById('store-select');
            select.innerHTML = "";
            session.availableStores.forEach(store => {
                const opt = document.createElement('option');
                opt.value = store.id;
                opt.innerText = store.name;
                select.appendChild(opt);
            });
            changeStore();
            initApp();
        }

        function changeStore() {
            const select = document.getElementById('store-select');
            const storeId = select.value;
            console.log(`Store changed to: ${storeId}`);
        }

        function logout() {
            currentSession = null;
            location.reload();
        }

        function resetPos() {
            total = 0;
            cartItems = [];
            document.getElementById('items').innerHTML = "";
            document.getElementById('total-display').innerText = "0";
            document.getElementById('page-payment').classList.remove('active');
            document.getElementById('page-pos').classList.add('active');
        }

        // --- POS & Scanner Logic ---
        const hints = new Map();
        const formats = [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8];
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
        const codeReader = new ZXing.BrowserMultiFormatReader(hints);

        let total = 0;
        let isPaused = false;
        let cartItems = [];

        async function mockProductApi(janCode) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    if (typeof productMaster !== 'undefined' && productMaster[janCode]) {
                        resolve({ janCode, ...productMaster[janCode] });
                    } else {
                        resolve({ janCode, name: "未登録商品", price: 200, category: "不明" });
                    }
                }, 300);
            });
        }

        async function goToPayment() {
            if (total === 0) return alert("商品がありません");

            const mask = document.getElementById('mask');
            document.getElementById('mask-msg').innerText = "QR作成中...";
            mask.style.display = 'flex';

            try {
                const initRes = await mockPaymentInitApi(cartItems, total);

                // Log Transaction
                const selectedStoreId = document.getElementById('store-select').value;
                logTransaction(selectedStoreId, currentSession.chainId, total, initRes.orderId);

                document.getElementById('page-pos').classList.remove('active');
                document.getElementById('page-payment').classList.add('active');
                document.getElementById('final-total').innerText = total.toLocaleString();

                const qrContainer = document.getElementById('qrcode');
                qrContainer.innerHTML = "";
                new QRCode(qrContainer, {
                    text: initRes.paymentUrl,
                    width: 180, height: 180,
                    correctLevel: QRCode.CorrectLevel.M
                });

                mask.style.display = 'none';

            } catch (e) {
                console.error(e);
                alert("エラー: " + e.message);
                mask.style.display = 'none';
            }
        }

        function backToScan() {
            document.getElementById('page-payment').classList.remove('active');
            document.getElementById('page-pos').classList.add('active');
        }

        async function mockPaymentInitApi(cartData, totalAmount) {
            const AWS_URL = 'https://c7fnqeywme.execute-api.us-east-1.amazonaws.com/default/gmo-payment-url-generator';
            try {
                const response = await fetch(AWS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: totalAmount, orderId: "T" + Date.now() })
                });
                if (!response.ok) throw new Error("API Error");
                return await response.json();
            } catch (e) {
                // throw e; // Pass error for debugging
                // Mock fallback if offline for demo
                return { paymentUrl: "https://example.com/pay_mock", orderId: "MOCK" + Date.now() };
            }
        }

        function showAdminStats() {
            const stats = getAdminStats();
            const msg = `【今月の売上速報】\n` +
                `----------------------------\n` +
                `総取引: ${stats.count}件\n` +
                `流通額: ¥${stats.totalSales.toLocaleString()}\n` +
                `----------------------------\n` +
                `★手数料収益(1%): ¥${stats.totalFees.toLocaleString()}\n`;
            alert(msg);
        }

        async function startScanner() {
            try {
                const videoInputDevices = await codeReader.listVideoInputDevices();
                const backCamera = videoInputDevices.find(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('rear'));
                const deviceId = backCamera ? backCamera.deviceId : videoInputDevices[0].deviceId;
                codeReader.decodeFromVideoDevice(deviceId, 'video', (result, err) => {
                    if (result && !isPaused) onScanSuccess(result.text);
                });
            } catch (err) { console.error(err); }
        }

        async function onScanSuccess(code) {
            if (isPaused) return;
            isPaused = true;
            const mask = document.getElementById('mask');
            document.getElementById('mask-msg').innerText = "Searching...";
            mask.style.display = 'flex';

            try {
                const product = await mockProductApi(code);

                document.getElementById('mask-msg').innerText = "Scan OK!";
                setTimeout(() => mask.style.display = 'none', 200);

                document.getElementById('btn-next').style.display = 'block';

                total += product.price;
                cartItems.push(product);

                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `
                    <div style="display:flex; flex-direction:column; align-items:flex-start;">
                        <span style="font-weight:600;">${product.name}</span>
                        <span style="font-size:12px; color:#aaa;">${code}</span>
                    </div>
                    <span style="font-weight:700;">¥${product.price}</span>`;
                document.getElementById('items').prepend(row);
                document.getElementById('total-display').innerText = total.toLocaleString();
                if (navigator.vibrate) navigator.vibrate(100);

            } catch (error) { resumeScan(); }
        }

        function resumeScan() {
            isPaused = false;
            document.getElementById('mask').style.display = 'none';
            document.getElementById('btn-next').style.display = 'none';
        }

        function initApp() {
            const mask = document.getElementById('mask');
            mask.style.display = 'flex';
            mask.onclick = () => {
                mask.style.display = 'none';
                mask.onclick = null;
                startScanner();
            };
        }
    </script>
</body>

</html>
